<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GEL Converter</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ffffff'/><text x='50' y='65' font-size='55' text-anchor='middle'>💱</text></svg>">
<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:24px;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
 background:#f2f2f7;
 color:#111;
}
.card{
 max-width:420px;
 margin:auto;
 background:white;
 border-radius:28px;
 padding:24px;
 box-shadow:0 8px 30px rgba(0,0,0,.08);
}
h1{text-align:center;font-size:26px;margin:0 0 20px}
input{
 width:100%;
 font-size:38px;
 text-align:center;
 padding:15px;
 border-radius:18px;
 border:2px solid #ddd;
 outline:none;
}
.buttons{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-top:20px;
}
button{
 border:0;
 border-radius:16px;
 padding:16px 5px;
 font-size:18px;
 font-weight:600;
 background:#f0f0f5;
 cursor:pointer;
}
button:active{transform:scale(.96)}
.result{
 margin-top:25px;
 background:#f7f7fa;
 border-radius:20px;
 padding:18px;
 font-size:22px;
 line-height:1.8;
}
.rate{
 margin-top:15px;
 text-align:center;
 color:#666;
 font-size:14px;
}
.refresh{
 width:100%;
 margin-top:15px;
 background:#111;
 color:white;
}
</style>
</head>
<body>
<div class="card">
<h1>🇬🇪 GEL Конвертер</h1>

<input id="amount" type="number" placeholder="Сума GEL" oninput="convert()">

<div class="buttons">
<button onclick="setAmount(5)">5</button>
<button onclick="setAmount(10)">10</button>
<button onclick="setAmount(20)">20</button>
<button onclick="setAmount(50)">50</button>
<button onclick="setAmount(100)">100</button>
<button onclick="setAmount(200)">200</button>
<button onclick="setAmount(500)">500</button>
<button onclick="setAmount(1000)">1000</button>
</div>

<div class="result" id="result">Введіть суму</div>
<div class="rate" id="rate"></div>

<button class="refresh" onclick="loadRates()">🔄 Оновити курс</button>
</div>

<script>
let rates={};

function setAmount(v){
 document.getElementById('amount').value=v;
 convert();
}

async function loadRates(){
 try{
  let r=await fetch('https://open.er-api.com/v6/latest/GEL');
  let d=await r.json();
  rates=d.rates;
  localStorage.setItem('rates',JSON.stringify(rates));
  document.getElementById('rate').innerHTML='Курс оновлено';
  convert();
 }catch(e){
  let saved=localStorage.getItem('rates');
  if(saved) rates=JSON.parse(saved);
 }
}

function convert(){
 let a=Number(document.getElementById('amount').value);
 if(!a || !rates.UAH){
  document.getElementById('result').innerHTML='Введіть суму';
  return;
 }
 document.getElementById('result').innerHTML=
 `🇺🇦 ${(a*rates.UAH).toFixed(0)} грн<br>
  🇵🇱 ${(a*rates.PLN).toFixed(0)} zł<br>
  🇺🇸 ${(a*rates.USD).toFixed(2)} $`;
}

loadRates();
</script>
</body>
</html>
