<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mendaliuk GEL" />
  <title>Mendaliuk GEL</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'>
    <defs>
      <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0%' stop-color='%230f2040'/>
        <stop offset='100%' stop-color='%23091a34'/>
      </linearGradient>
    </defs>
    <rect width='180' height='180' rx='38' fill='url(%23g)'/>
    <text x='90' y='78' text-anchor='middle' font-size='54'>🇬🇪</text>
    <text x='90' y='122' text-anchor='middle' font-size='34' fill='white' font-family='Arial, sans-serif'>GEL</text>
    <text x='132' y='132' text-anchor='middle' font-size='28' fill='%23469BFF'>↔</text>
  </svg>">
  <style>
    :root{
      --bg1:#07111f;
      --bg2:#0b1630;
      --panel:rgba(22,33,53,.70);
      --panel2:rgba(27,40,63,.82);
      --line:rgba(255,255,255,.08);
      --text:#eef4ff;
      --muted:#a8b7cf;
      --blue:#1677ff;
      --blue2:#2a8cff;
      --green1:rgba(35,120,67,.38);
      --green2:rgba(37,76,58,.82);
      --red1:rgba(122,42,55,.45);
      --red2:rgba(74,34,43,.88);
      --usd1:rgba(33,72,123,.42);
      --usd2:rgba(23,50,87,.88);
      --shadow:0 15px 40px rgba(0,0,0,.30);
      --radius:24px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      min-height:100vh;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(33,74,135,.35), transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(18,79,181,.20), transparent 35%),
        linear-gradient(180deg, #050d18 0%, #081321 38%, #091526 100%);
    }
    .app{
      max-width:430px;
      margin:0 auto;
      padding:18px 16px 22px;
    }
    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:14px;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:flex-start;
      min-width:0;
    }
    .logo{
      width:52px;height:52px;border-radius:14px;
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.08);
      display:grid;place-items:center;
      font-size:30px;
      box-shadow:var(--shadow);
      flex:0 0 auto;
    }
    .title{
      font-size:24px;
      font-weight:800;
      line-height:1.08;
      letter-spacing:-.02em;
      margin:4px 0 4px;
    }
    .subtitle{
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
    }
    .icon-btn{
      width:46px;height:46px;border-radius:16px;
      display:grid;place-items:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
      color:#dce9ff;
      font-size:20px;
      box-shadow:var(--shadow);
      flex:0 0 auto;
    }
    .input-box{
      display:flex;
      align-items:center;
      gap:12px;
      background:linear-gradient(180deg, rgba(35,49,72,.86), rgba(26,38,58,.93));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:var(--shadow);
      border-radius:28px;
      padding:18px 18px 18px 22px;
      margin:14px 0 20px;
    }
    .amount{
      width:100%;
      appearance:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:34px;
      font-weight:800;
      letter-spacing:-.04em;
      min-width:0;
    }
    .amount::placeholder{color:#7f93b0}
    .currency{
      color:#dbe5f4;
      font-weight:700;
      font-size:20px;
      opacity:.95;
      white-space:nowrap;
    }
    .clear-btn{
      width:38px;height:38px;border-radius:50%;
      border:none;cursor:pointer;
      background:rgba(255,255,255,.10);
      color:#d7e2f2;font-size:20px;font-weight:700;
      display:grid;place-items:center; flex:0 0 auto;
    }
    .section-title{
      font-size:15px;
      font-weight:800;
      letter-spacing:.01em;
      margin:0 0 12px;
      color:#f2f6ff;
    }
    .quick-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:22px;
    }
    .quick-btn{
      border:none;
      border-radius:18px;
      padding:14px 8px;
      font-size:18px;
      font-weight:800;
      color:#eff5ff;
      background:linear-gradient(180deg, rgba(35,53,81,.90), rgba(25,39,61,.95));
      border:1px solid rgba(255,255,255,.06);
      box-shadow:var(--shadow);
      cursor:pointer;
      transition:transform .08s ease, background .15s ease, border-color .15s ease;
    }
    .quick-btn:active{transform:scale(.98)}
    .quick-btn.active{
      background:linear-gradient(180deg, #2180ff, #156dff);
      border-color:rgba(255,255,255,.14);
    }
    .card{
      border-radius:28px;
      padding:18px 16px;
      display:flex;
      align-items:center;
      gap:14px;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.06);
      margin-bottom:14px;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .uah{background:linear-gradient(90deg, var(--green1), var(--green2));}
    .pln{background:linear-gradient(90deg, var(--red1), var(--red2));}
    .usd{background:linear-gradient(90deg, var(--usd1), var(--usd2));}
    .flag{
      width:56px;height:56px;border-radius:50%;
      display:grid;place-items:center;
      background:rgba(255,255,255,.10);
      font-size:32px; flex:0 0 auto;
      border:1px solid rgba(255,255,255,.10);
    }
    .value-wrap{min-width:0; flex:1}
    .label{
      color:#eff5ff;
      font-size:15px;
      font-weight:700;
      opacity:.95;
      margin-bottom:4px;
    }
    .value{
      display:flex;
      align-items:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .num{
      font-size:32px;
      line-height:1;
      font-weight:900;
      letter-spacing:-.04em;
      color:#fff;
    }
    .unit{
      font-size:17px;
      color:#d9e5f5;
      opacity:.96;
      font-weight:700;
      margin-bottom:3px;
    }
    .copy-btn{
      width:48px;height:48px;border-radius:18px;
      border:none; cursor:pointer;
      color:#eaf2ff;
      background:rgba(255,255,255,.10);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
      font-size:22px;
      flex:0 0 auto;
    }
    .info-card{
      display:flex; gap:12px; align-items:flex-start;
      background:linear-gradient(180deg, rgba(39,56,84,.78), rgba(27,40,61,.90));
      border:1px solid rgba(255,255,255,.06);
      box-shadow:var(--shadow);
      border-radius:24px;
      padding:16px 16px;
      margin-top:6px;
    }
    .info-icon{
      width:42px;height:42px;border-radius:50%;
      display:grid;place-items:center;
      font-size:24px;
      color:#d6e6ff;
      background:rgba(255,255,255,.06);
      flex:0 0 auto;
    }
    .rates-line{
      font-size:15px;
      font-weight:800;
      line-height:1.4;
      color:#f2f7ff;
      margin-top:2px;
    }
    .updated{
      margin-top:8px;
      font-size:14px;
      color:var(--muted);
    }
    .update-btn{
      margin-top:6px;
      width:100%;
      border:none;
      border-radius:24px;
      padding:18px 18px;
      font-size:18px;
      font-weight:900;
      color:#fff;
      background:linear-gradient(180deg, var(--blue2), var(--blue));
      box-shadow:0 16px 34px rgba(11,100,255,.35);
      cursor:pointer;
    }
    .status{
      margin-top:10px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      min-height:18px;
    }
    @media (max-width:360px){
      .title{font-size:22px}
      .amount{font-size:30px}
      .quick-grid{gap:10px}
      .quick-btn{padding:12px 6px}
      .num{font-size:28px}
      .flag{width:50px;height:50px;font-size:28px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="logo">🇬🇪</div>
        <div>
          <div class="title">Mendaliuk GEL</div>
          <div class="subtitle">Грузинський ларі → гривня, злотий, долар</div>
        </div>
      </div>
      
    </div>

    <div class="input-box">
      <input class="amount" id="amount" type="number" inputmode="decimal" placeholder="0" />
      <div class="currency">GEL</div>
      <button class="clear-btn" type="button" id="clearBtn" aria-label="Очистити">×</button>
    </div>

    <div class="section-title">Швидкі суми (GEL)</div>
    <div class="quick-grid" id="quickGrid">
      <button class="quick-btn" type="button" data-value="5">5</button>
      <button class="quick-btn" type="button" data-value="10">10</button>
      <button class="quick-btn" type="button" data-value="20">20</button>
      <button class="quick-btn" type="button" data-value="50">50</button>
      <button class="quick-btn" type="button" data-value="100">100</button>
      <button class="quick-btn" type="button" data-value="200">200</button>
      <button class="quick-btn" type="button" data-value="500">500</button>
      <button class="quick-btn" type="button" data-value="1000">1000</button>
    </div>

    <div class="card uah">
      <div class="flag">🇺🇦</div>
      <div class="value-wrap">
        <div class="label">Гривня (UAH)</div>
        <div class="value"><div class="num" id="uahValue">—</div><div class="unit">грн</div></div>
      </div>
      <button class="copy-btn" type="button" data-copy="uah" aria-label="Скопіювати гривні">⧉</button>
    </div>

    <div class="card pln">
      <div class="flag">🇵🇱</div>
      <div class="value-wrap">
        <div class="label">Злотий (PLN)</div>
        <div class="value"><div class="num" id="plnValue">—</div><div class="unit">zł</div></div>
      </div>
      <button class="copy-btn" type="button" data-copy="pln" aria-label="Скопіювати злоті">⧉</button>
    </div>

    <div class="card usd">
      <div class="flag">🇺🇸</div>
      <div class="value-wrap">
        <div class="label">Долар (USD)</div>
        <div class="value"><div class="num" id="usdValue">—</div><div class="unit">$</div></div>
      </div>
      <button class="copy-btn" type="button" data-copy="usd" aria-label="Скопіювати долари">⧉</button>
    </div>

    
    <button class="update-btn" type="button" id="updateBtn">↻&nbsp;&nbsp;Оновити курс</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const amountInput = document.getElementById('amount');
    const uahValue = document.getElementById('uahValue');
    const plnValue = document.getElementById('plnValue');
    const usdValue = document.getElementById('usdValue');
    const ratesLine = document.getElementById('ratesLine');
    const updatedAt = document.getElementById('updatedAt');
    const statusEl = document.getElementById('status');
    const updateBtn = document.getElementById('updateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const quickButtons = [...document.querySelectorAll('.quick-btn')];
    const copyButtons = [...document.querySelectorAll('.copy-btn')];

    let rates = null;
    let lastValues = { uah: '', pln: '', usd: '' };

    function formatInt(value){
      return new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 0 }).format(value);
    }
    function formatPLN(value){
      return new Intl.NumberFormat('uk-UA', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(value);
    }
    function formatUSD(value){
      return new Intl.NumberFormat('uk-UA', { minimumFractionDigits: 1, maximumFractionDigits: 2 }).format(value);
    }
    function formatRate(value, digits){
      return new Intl.NumberFormat('uk-UA', { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(value);
    }
    function setStatus(text){
      statusEl.textContent = text || '';
    }
    function saveAmount(){
      localStorage.setItem('gel_amount', amountInput.value || '');
    }
    function restoreAmount(){
      const saved = localStorage.getItem('gel_amount');
      if(saved !== null){
        amountInput.value = saved;
      }
    }
    function setUpdatedLabel(dateText){
      updatedAt.textContent = 'Оновлено: ' + dateText;
    }
    function updateQuickActive(){
      const v = amountInput.value.trim();
      quickButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === v);
      });
    }
    function resetValues(){
      uahValue.textContent = '—';
      plnValue.textContent = '—';
      usdValue.textContent = '—';
      lastValues = { uah: '', pln: '', usd: '' };
    }
    function convert(){
      const amount = parseFloat((amountInput.value || '').replace(',', '.'));
      saveAmount();
      updateQuickActive();

      if(!rates || isNaN(amount)){
        resetValues();
        return;
      }

      const uah = amount * rates.UAH;
      const pln = amount * rates.PLN;
      const usd = amount * rates.USD;

      const uahText = formatInt(uah);
      const plnText = formatPLN(pln);
      const usdText = formatUSD(usd);

      uahValue.textContent = uahText;
      plnValue.textContent = plnText;
      usdValue.textContent = usdText;

      lastValues = {
        uah: uahText + ' грн',
        pln: plnText + ' zł',
        usd: usdText + ' $'
      };
    }
    function applyRates(newRates, sourceText, timeText){
      rates = newRates;
      localStorage.setItem('gel_rates', JSON.stringify(newRates));
      ratesLine.innerHTML = '1 GEL = ' + formatRate(rates.UAH, 2) + ' UAH&nbsp;&nbsp;|&nbsp;&nbsp;' + formatRate(rates.PLN, 4) + ' PLN&nbsp;&nbsp;|&nbsp;&nbsp;' + formatRate(rates.USD, 4) + ' USD';
      setUpdatedLabel(timeText);
      setStatus(sourceText);
      convert();
    }
    function getLocalTimeText(){
      return new Date().toLocaleString('uk-UA', {
        day:'2-digit', month:'2-digit', year:'numeric',
        hour:'2-digit', minute:'2-digit'
      });
    }
    async function loadRates(forceOnline = true){
      setStatus('Оновлення курсу…');
      try{
        const response = await fetch('https://open.er-api.com/v6/latest/GEL', { cache: 'no-store' });
        if(!response.ok) throw new Error('network');
        const data = await response.json();
        if(!data || !data.rates) throw new Error('invalid');
        applyRates(data.rates, 'Курс оновлено', getLocalTimeText());
      }catch(err){
        const cached = localStorage.getItem('gel_rates');
        const cachedTime = localStorage.getItem('gel_rates_time');
        if(cached){
          try{
            const parsed = JSON.parse(cached);
            rates = parsed;
            ratesLine.innerHTML = '1 GEL = ' + formatRate(rates.UAH, 2) + ' UAH&nbsp;&nbsp;|&nbsp;&nbsp;' + formatRate(rates.PLN, 4) + ' PLN&nbsp;&nbsp;|&nbsp;&nbsp;' + formatRate(rates.USD, 4) + ' USD';
            setUpdatedLabel(cachedTime || 'збережений курс');
            setStatus('Немає інтернету — використано збережений курс');
            convert();
            return;
          } catch(e){}
        }
        setStatus('Не вдалося завантажити курс');
        resetValues();
      } finally {
        localStorage.setItem('gel_rates_time', getLocalTimeText());
      }
    }
    function copyText(text){
      if(!text) return;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => setStatus('Скопійовано: ' + text)).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text){
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      setStatus('Скопійовано: ' + text);
    }

    amountInput.addEventListener('input', convert);
    amountInput.addEventListener('focus', () => setStatus(''));
    clearBtn.addEventListener('click', () => {
      amountInput.value = '';
      saveAmount();
      updateQuickActive();
      resetValues();
      setStatus('');
      amountInput.focus();
    });
    updateBtn.addEventListener('click', () => loadRates(true));

    quickButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        amountInput.value = btn.dataset.value;
        convert();
      });
    });
    copyButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.copy;
        copyText(lastValues[key]);
      });
    });

    restoreAmount();
    updateQuickActive();
    loadRates(true);
  </script>
</body>
</html>
